[build-system]
requires = ["hatchling>=1.27.0", "jupyterlab>=4.4.0,<5", "hatch-jupyter-builder>=0.9.1"]
build-backend = "hatchling.build"

[project]
name = "provjup"
version = "0.0.0"
description = "JupyterLab recorder for Provenance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
]
dependencies = ["jupyter_server>=2.16.0,<3", "watchdog>=4,<8"]

[dependency-groups]
# Development only; never installed for students.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.sdist]
artifacts = ["provjup/labextension"]
exclude = [".github", "node_modules", "lib", "vendor/provenance/packages/*/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["provjup"]

[tool.hatch.build.targets.wheel.shared-data]
"provjup/labextension" = "share/jupyter/labextensions/provjup"
"install.json" = "share/jupyter/labextensions/provjup/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.9.1"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["provjup/labextension/package.json"]
skip-if-exists = ["provjup/labextension/package.json"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build"
npm = ["npm"]
source_dir = "src"
build_dir = "provjup/labextension"

[tool.ruff]
line-length = 100
src = [".", "tests/server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["provjup"]

[tool.pytest.ini_options]
testpaths = ["tests/server"]
